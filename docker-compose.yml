services:
  platform:
    build: .
    # Google Chrome deb is amd64; Apple Silicon runs via emulation.
    platform: linux/amd64
    ports:
      # Host 8080 avoids clashes with other local services already on 8000
      - "8080:8000"
      # noVNC — watch Headful UC Chrome sessions
      - "7900:7900"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/runs.db
      # Same anti-detect path as desktop local: UC Mode inside the container.
      # Empty remote URL so the bot never falls back to classic Grid WebDriver.
      SELENIUM_REMOTE_URL: ""
      DRIVER_MODE: uc
      DISPLAY: ":99"
      DOCKER_UC_DISPLAY: ":99"
      CHROME_BINARY: /usr/bin/google-chrome-stable
      TZ: Asia/Tehran
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      SCREEN_WIDTH: "1440"
      SCREEN_HEIGHT: "900"
      SCREEN_DEPTH: "24"
    shm_size: "2gb"
    volumes:
      # Persist run history across container restarts
      - bot_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  bot_data:
